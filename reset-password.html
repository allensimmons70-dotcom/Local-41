<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width,initial-scale=1">

  <meta name="theme-color"
        content="#111111">

  <title>
    Reset Password | Local 41 KC
  </title>

  <link rel="stylesheet"
        href="style.css">

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <script src="supabase.js"
          defer>
  </script>

  <script src="reset-password.js"
          defer>
  </script>

</head>


<body>


<header class="top">

  <div class="wrap nav">

    <a class="brand"
       href="index.html">

      <span>LOCAL</span>
      <b>41</b>

      <small>
        KANSAS CITY
      </small>

    </a>

  </div>

</header>



<main>


<section class="contract-hero">

  <div class="wrap">

    <p class="eyebrow">
      SECURE MEMBER PORTAL
    </p>

    <h1>
      RESET
      <em>PASSWORD.</em>
    </h1>

    <p class="contract-lead">

      Create a new password for your
      Local 41 member account.

    </p>

  </div>

</section>



<section class="auth-section">

  <div class="wrap">

    <div
      id="resetMessage"
      class="auth-message"
      aria-live="polite">
    </div>


    <div class="auth-grid">

      <div class="auth-card">

        <p class="article-number">
          ACCOUNT SECURITY
        </p>

        <h2>
          CREATE NEW PASSWORD
        </h2>


        <form
          id="resetPasswordForm"
          class="auth-form"
          onsubmit="updatePassword(event)">


          <label for="newPassword">
            NEW PASSWORD
          </label>

          <input
            id="newPassword"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          >


          <label for="confirmNewPassword">
            CONFIRM NEW PASSWORD
          </label>

          <input
            id="confirmNewPassword"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          >


          <button
            type="submit"
            class="auth-submit">

            UPDATE PASSWORD →

          </button>

        </form>

      </div>

    </div>

  </div>

</section>


</main>



<footer>

  <div class="wrap">

    <b>
      LOCAL 41 • KANSAS CITY
    </b>

    <span>
      Secure Member Portal
    </span>

  </div>

</footer>


</body>

</html>
